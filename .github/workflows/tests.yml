name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          taobom --version
          taobom parts core1106_stereo_bom.csv
          taobom mock core1106_stereo_bom.csv -o listings.json
          taobom plan core1106_stereo_bom.csv listings.json -o plan.md
